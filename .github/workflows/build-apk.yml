# Builds the Android app on GitHub's servers every time something is pushed.
# The finished app (NIDA-Enrolment.apk) is attached to a GitHub Release, which you can open on
# the phone: github.com/mohamedbaruti/FormReader/releases -> latest -> NIDA-Enrolment.apk
name: Build Android app
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6        # Chaquopy needs the same Python version as the app
        with:
          python-version: "3.10"
      - name: Build the app
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee ../build.log; then
            # show the reason on the build's summary page (the full log is in the step above)
            grep -n -A25 "What went wrong" ../build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | sed 's/^/::error title=Build failed::/'
            grep -inE "error:|ERROR|failed" ../build.log | grep -v "^.*warning" | tail -25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=Error lines::/'
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../NIDA-Enrolment.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NIDA-Enrolment-apk
          path: NIDA-Enrolment.apk
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NIDA Enrolment (build ${{ github.run_number }})
          body: Install NIDA-Enrolment.apk on the phone.
          files: NIDA-Enrolment.apk
